name: Release Desktop

# Builds ONLY the Windows Electron desktop app (apps/desktop, plus its
# packages/shared workspace dependency) and publishes the resulting NSIS
# installer + portable EXE as a GitHub Release. apps/server is never built
# or packaged here and is never part of the released artifacts.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages/shared
        run: npm run build -w packages/shared

      - name: Typecheck packages/shared
        run: npm run typecheck -w packages/shared

      - name: Test packages/shared
        run: npm run test -w packages/shared

      - name: Typecheck apps/desktop
        run: npm run typecheck -w apps/desktop

      - name: Test apps/desktop
        run: npm run test -w apps/desktop

      - name: Build apps/desktop (electron-vite)
        run: npm run build -w apps/desktop

      - name: Package Windows installer + portable EXE (electron-builder)
        run: npm run package -w apps/desktop

      - name: Compute release version and tag
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $tag = "v$version-build.${{ github.run_number }}"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "short_sha=$shortSha" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: List packaged artifacts
        shell: pwsh
        run: Get-ChildItem "apps/desktop/release" -Filter "*.exe" | Format-Table Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SoulLink Overlay ${{ steps.version.outputs.tag }} (${{ steps.version.outputs.short_sha }})
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            apps/desktop/release/*.exe
